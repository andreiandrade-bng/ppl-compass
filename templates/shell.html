<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shell — BNG People</title>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/andreiandrade-bng/ppl-compass@0.5.0/dist/ppl-compass.css"
      integrity="sha384-GtiX78xFYEvnHF3D6PbfEwl0OQsFnkaZk2usuHomx/JyFUtN4JfSQgI7T/iZREoh"
      crossorigin="anonymous">
</head>
<body>

<!-- ════════════════════════════════════════════════════════════════════════
     A CASCA. Todos os outros templates são este arquivo com conteúdo dentro
     do <main>. Para a tela seguinte: copie, troque "rotaAtiva", troque a
     migalha do topo e escreva o miolo.

     A navegação inteira sai do JSON abaixo — é por isso que dez telas não
     custam dez cópias de marcação, e sim dez vezes a mesma lista com uma rota
     diferente. Item sem rótulo, grupo vazio, contador que não é número ou
     rota ativa fora do menu trocam a navegação por um alerta: ela falha
     fechado de propósito, porque menu que não sabe onde você está mente com
     confiança.

     A sidebar é sempre noite, nos dois temas; o conteúdo segue o tema do
     aparelho (`prefers-color-scheme`) e o alternador da topbar vence a
     preferência do sistema nos dois sentidos. O contador de Pendências é o
     ÚNICO pêssego do console: a luz do horizonte só existe sobre a noite, e
     dois horizontes não apontam. Por isso há um contador só no JSON.
     ════════════════════════════════════════════════════════════════════ -->

<div class="ppl-shell">

  <aside class="ppl-nav" data-ppl-nav>
    <script type="application/json">
    {
      "rotaAtiva": "/",
      "marca":  { "logo": "people", "nome": "BNG People", "tag": "Depto. Pessoal", "href": "/" },
      "itens": [
        { "label": "Início",     "icone": "house",        "href": "/" },
        { "label": "Pendências", "icone": "circle-alert", "href": "/pendencias", "contador": 184368 },
        { "grupo": "Estrutura", "itens": [
          { "label": "Empresas",      "icone": "building", "href": "/empresas" },
          { "label": "Colaboradores", "icone": "users",    "href": "/colaboradores" },
          { "label": "Lotações",      "icone": "map-pin",  "href": "/lotacoes" }
        ]},
        { "grupo": "Folha", "itens": [
          { "label": "Rubricas",  "icone": "list",       "href": "/rubricas" },
          { "label": "Folha",     "icone": "wallet",     "href": "/folha" },
          { "label": "Férias",    "icone": "tree-palm",  "href": "/ferias" },
          { "label": "Rescisões", "icone": "calendar-x", "href": "/rescisoes" }
        ]},
        { "grupo": "Ponto", "itens": [
          { "label": "Espelho",   "icone": "calendar",     "href": "/ponto" },
          { "label": "Correções", "icone": "clock-fading", "href": "/correcoes" }
        ]},
        { "grupo": "Obrigações", "itens": [
          { "label": "eSocial",    "icone": "send", "href": "/esocial" },
          { "label": "Relatórios", "icone": "file", "href": "/relatorios" }
        ]}
      ],
      "usuario": {
        "iniciais": "AR",
        "nome": "ana.ribeiro@gestaohospitalar.com.br",
        "papel": "Console RH",
        "sair": "/sair"
      }
    }
    </script>
  </aside>

  <div class="ppl-shell__col ppl-canvas">

    <header class="ppl-topbar ppl-bar">
      <div class="ppl-topbar__row">
        <!-- O chip tonal diz qual grupo econômico está ativo. É chip, e não
             rótulo em caixa alta: o eyebrow foi abolido na v6B. -->
        <span class="ppl-topbar__chip">Grupo Boas Novas</span>
        <span class="ppl-topbar__crumb"><i data-ppl-icon="house" data-ppl-size="15"></i>Início</span>
        <div class="ppl-topbar__actions">
          <button class="ppl-btn ppl-btn--icon ppl-btn--secondary" aria-label="Produtos">
            <i data-ppl-icon="layout-grid" data-ppl-size="16"></i>
          </button>
          <button class="ppl-btn ppl-btn--icon ppl-btn--secondary" aria-label="Buscar" data-ppl-search-open>
            <i data-ppl-icon="search" data-ppl-size="16"></i>
          </button>
          <!-- O tema escuro é de primeira classe: vale no shell inteiro, e o
               alternador mora aqui, no cromo, e não escondido numa página. -->
          <button class="ppl-btn ppl-btn--icon ppl-btn--secondary" data-ppl-theme-toggle aria-label="Alternar tema">
            <i data-ppl-icon="moon" data-ppl-size="16"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="ppl-main">
      <div class="ppl-page-head">
        <div class="ppl-page-head__id">
          <h1 class="ppl-page-head__title">Título da tela</h1>
          <!-- O contexto que decide — quem, qual CNPJ, qual competência — é
               caption ABAIXO do título, em 12px suave. Ele fica visível do
               início ao fim do fluxo; mora aqui, não numa tela anterior. -->
          <div class="ppl-page-head__meta">Competência 2026-08 · Gestão Hospitalar Ltda</div>
          <p class="ppl-page-head__desc">
            A descrição diz o que a tela faz em uma frase. Se precisar de duas,
            o título está errado.
          </p>
        </div>
        <div class="ppl-page-head__actions">
          <button class="ppl-btn ppl-btn--secondary ppl-btn--sm">Ação secundária</button>
          <button class="ppl-btn ppl-btn--primary ppl-btn--sm">Ação primária</button>
        </div>
      </div>

      <div class="ppl-card ppl-panel">
        <p class="ppl-muted">O miolo entra aqui. Veja templates/README.md para escolher o arquétipo.</p>
      </div>
    </main>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/gh/andreiandrade-bng/ppl-compass@0.5.0/dist/ppl-compass-icons.js"
        integrity="sha384-K7HJQ+0th6kgYPtM02Ac4GpT4x/2JVA8oI33rClJ/XEdNIkGmSK+Z4IkMfyJqcHb" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/gh/andreiandrade-bng/ppl-compass@0.5.0/dist/ppl-compass.js"
        integrity="sha384-I1G8vAmXzfvEHSYLoCYHp0xUu3aWq2EIv8WBNscMn68emHFPkI1mPdDgoua8PYGO" crossorigin="anonymous"></script>
<script>addEventListener('DOMContentLoaded', () => PplCompass.init());</script>
</body>
</html>
